<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>敦煌莫高窟第96窟 · 实时建造全过程</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{color-scheme:dark;--gold:#d9a85e;--panel:rgba(8,10,12,.82);--line:rgba(255,255,255,.12);--ink:#070807}
  html,body{width:100%;height:100%;overflow:hidden;background:#050607;color:#eee7da;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app,#stage{position:fixed;inset:0}
  #stage{display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 42%,rgba(126,91,49,.16) 0%,transparent 42%),
      radial-gradient(ellipse at 52% 35%,#1a1a17 0%,#0b0c0c 48%,#030404 100%)}
  #stage>*{position:absolute}
  canvas#c{display:block;max-width:100%;max-height:100%;background:#08090a;
    box-shadow:0 30px 110px rgba(0,0,0,.78),0 0 0 1px rgba(213,168,93,.12)}
  svg#anno{pointer-events:none;overflow:visible}
  #hud{pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:0 10% 86px}
  #sub{max-width:72%;padding:7px 17px;border-radius:8px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.48),transparent);
    color:#fff;font-size:clamp(17px,1.55vw,27px);font-weight:780;line-height:1.38;letter-spacing:.03em;text-align:center;
    text-shadow:0 2px 5px #000,0 0 18px rgba(0,0,0,.8)}
  #hint{left:18px;top:18px;padding:9px 12px;border:1px solid rgba(255,255,255,.09);border-radius:8px;
    background:rgba(7,9,11,.56);backdrop-filter:blur(9px);font-size:11px;line-height:1.65;color:#a8adb2;pointer-events:none}
  #stepcard{right:18px;top:18px;width:min(340px,38vw);padding:13px 15px;border:1px solid rgba(224,177,96,.30);border-radius:4px 14px 4px 14px;
    background:linear-gradient(145deg,rgba(10,12,13,.92),rgba(43,31,18,.72));backdrop-filter:blur(12px);
    box-shadow:0 15px 42px rgba(0,0,0,.34);pointer-events:none}
  #stepnum{float:left;margin-right:11px;color:#e7b66a;font-size:23px;font-weight:900;line-height:1}
  #stepcopy{overflow:hidden}
  #steptitle{display:block;color:#fff6e8;font-family:"Songti SC","STSong",serif;font-size:15px;font-weight:800;letter-spacing:.08em}
  #stepaction{display:block;margin-top:4px;color:#b8bdc2;font-size:11px;line-height:1.45}
  #stepprogress{display:block;height:3px;margin-top:9px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  #stepfill{display:block;width:0;height:100%;background:linear-gradient(90deg,#a96628,#f0c16f);box-shadow:0 0 10px rgba(238,175,77,.7)}
  #ui{left:50%;bottom:51px;transform:translateX(-50%);width:min(980px,calc(100% - 28px));height:46px;
    display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid rgba(255,255,255,.11);border-radius:12px;
    background:var(--panel);backdrop-filter:blur(13px);box-shadow:0 15px 45px rgba(0,0,0,.45)}
  #ui button,#ui select{height:31px;padding:0 11px;border:1px solid rgba(255,255,255,.13);border-radius:7px;
    background:rgba(255,255,255,.055);color:#ddd7cd;font:12px inherit;cursor:pointer}
  #ui button:hover,#ui select:hover,#ui button.on{background:rgba(212,151,70,.20);border-color:rgba(230,177,104,.45);color:#fff}
  #play{width:39px;padding:0!important;font-size:15px!important}
  #bar{position:relative;flex:1;height:8px;border-radius:7px;background:rgba(255,255,255,.12);cursor:pointer;overflow:hidden}
  #barfill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#a96a31,#e6b666)}
  #time{min-width:88px;color:#aeb2b6;font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
  #chapters{left:50%;bottom:10px;transform:translateX(-50%);width:min(1180px,calc(100% - 26px));height:34px;
    display:flex;align-items:center;gap:5px;padding:4px 7px;overflow-x:auto;scrollbar-width:none;border-radius:10px;
    background:rgba(8,10,12,.65);backdrop-filter:blur(10px)}
  #chapters::-webkit-scrollbar{display:none}
  #chapters button{height:25px;flex:0 0 auto;padding:0 10px;border:1px solid rgba(255,255,255,.09);border-radius:13px;
    background:rgba(255,255,255,.04);color:#9ca2a8;font:11px inherit;cursor:pointer;white-space:nowrap}
  #chapters button:hover{color:#f1d2a2;border-color:rgba(224,174,95,.35)}
  #chapters button.on{color:#fff;background:#8a5728;border-color:#d19a57}
  #chapters button.done{color:#d0b482}
  body.clean #ui,body.clean #chapters,body.clean #hint,body.clean #stepcard{display:none}
  #loading{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;
    background:radial-gradient(circle at 50% 40%,#241d15,#08090a 57%,#030404);transition:opacity .55s}
  #loading.gone{opacity:0;pointer-events:none}
  #ltitle{font-size:22px;font-weight:850;letter-spacing:.18em;color:#e5bf7d}
  #lsub{font-size:12px;color:#898c8e;letter-spacing:.08em}
  #lwrap{width:min(380px,70vw);height:4px;border-radius:3px;background:#252728;overflow:hidden}
  #lbar{height:100%;width:0;background:linear-gradient(90deg,#8f592b,#e4b66a);transition:width .16s}
  #ltxt{font-size:11px;color:#777c80}
  @media(max-width:760px){
    #hint{display:none}#stepcard{right:9px;top:9px;width:min(300px,72vw);padding:9px 11px}
    #stepnum{font-size:18px}#steptitle{font-size:12px}#stepaction{font-size:10px}
    #hud{padding-bottom:91px}#sub{max-width:90%;font-size:14px;padding:5px 10px}
    #ui{bottom:45px;height:40px;gap:6px;padding:5px 7px}#ui button,#ui select{height:28px;padding:0 7px;font-size:10px}
    #time{min-width:72px;font-size:10px}#freebtn,#hidebtn{display:none}
    #chapters{bottom:6px;height:33px}#chapters button{font-size:10px;padding:0 8px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <svg id="anno" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud"><div id="sub"></div></div>
    <div id="hint">空格：播放/暂停　← →：快退/快进<br>自由视角：拖拽旋转 · 滚轮缩放 · WASD/QE 平移</div>
    <div id="stepcard">
      <span id="stepnum">01</span><div id="stepcopy"><b id="steptitle">九层楼揭幕</b><span id="stepaction">木构逐层移开，显露彩绘大佛</span><i id="stepprogress"><u id="stepfill"></u></i></div>
    </div>
    <div id="ui">
      <button id="play">▶</button><div id="bar"><div id="barfill"></div></div><span id="time">0:00 / 1:56</span>
      <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button id="freebtn">自由视角</button><button id="hidebtn">纯净模式</button>
    </div>
    <div id="chapters"></div>
  </div>
</div>
<div id="loading"><div id="ltitle">敦煌莫高窟 · 第96窟</div><div id="lsub">洞窟开凿与大佛塑造 · 浏览器实时三维</div><div id="lwrap"><div id="lbar"></div></div><div id="ltxt">正在烘焙材质…</div></div>
<script type="module">/*__BUNDLE__*/</script>
</body>
</html>
